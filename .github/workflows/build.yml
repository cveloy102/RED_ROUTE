name: Windows installer
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Build pinned Amnezia core
        shell: pwsh
        run: ./scripts/build-engine.ps1 -Go (Get-Command go).Source
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -SkipEngine
      - name: Native WPF smoke test
        shell: pwsh
        run: |
          $process = Start-Process ./src/RedRoute.App/bin/Release/net10.0-windows/RED_ROUTE.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path artifacts/ui/result.txt)) { throw 'WPF smoke check failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: RED_ROUTE-windows-x64
          path: |
            artifacts/*.msi
            artifacts/ui/
