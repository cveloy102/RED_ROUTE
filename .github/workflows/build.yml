name: Windows installer
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Build pinned Amnezia core
        shell: pwsh
        run: ./scripts/build-engine.ps1 -Go (Get-Command go).Source
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -SkipEngine
      - name: Audit reachable Go vulnerabilities
        shell: pwsh
        working-directory: vendor/amnezia-box
        run: |
          $env:GOTOOLCHAIN = 'local'
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags 'with_gvisor,with_quic,with_wireguard,with_awg' ./cmd/sing-box
          if ($LASTEXITCODE -ne 0) { throw 'Go vulnerability audit failed' }
      - name: Native WPF smoke test
        shell: pwsh
        run: |
          ./scripts/test-ui.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RED_ROUTE-windows-x64
          path: |
            artifacts/*.msi
            artifacts/*-Setup.exe
            artifacts/*.sha256
            artifacts/*-engine-source.zip
            artifacts/ui/
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match the application version' }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; keeping its published assets'; exit 0 }
          gh release create $env:RELEASE_TAG "artifacts/RED_ROUTE-$version-Setup.exe" "artifacts/RED_ROUTE-$version-Setup.exe.sha256" "artifacts/RED_ROUTE-$version-win-x64.msi" "artifacts/RED_ROUTE-$version-engine-source.zip" --verify-tag --title "RED_ROUTE $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
